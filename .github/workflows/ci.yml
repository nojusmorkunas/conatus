name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Collecting page data evaluates every route module, and the storage and mail
  # clients are constructed at import time, so the build needs values for them
  # even though it never connects. These mirror the build stage in ./Dockerfile;
  # keep the two in step. The e2e job overrides DATABASE_URL's target by
  # pointing at its own Postgres service on the same address.
  DATABASE_URL: postgres://app:app@127.0.0.1:5432/app
  AUTH_SECRET: ci-placeholder-secret
  S3_ENDPOINT: 127.0.0.1
  S3_PORT: "9000"
  S3_ACCESS_KEY: ci-placeholder
  S3_SECRET_KEY: ci-placeholder
  S3_BUCKET: ci-placeholder
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_FROM: ci@localhost

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check that no route is prerendered against the CSP nonce
        run: npm run check:prerendered

  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm --prefix mcp-server ci

      - name: Lint
        run: npm --prefix mcp-server run lint

      - name: Test
        run: npm --prefix mcp-server test

      - name: Build
        run: npm --prefix mcp-server run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  compose:
    name: Compose manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate the Compose manifest
        run: >-
          docker compose --env-file .env.example
          -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
