version: 2

# Every entry groups its updates, so each ecosystem opens one pull request per
# batch rather than one per package. Groups are matched in order and the first
# match wins, which is why the next group is listed first.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next, React and the ESLint config are released in lockstep; splitting
      # them across pull requests produces combinations that never build. Kept
      # apart from the rest because it is the batch most likely to need review.
      next:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # Held back deliberately: next-auth v5 is still a beta line and each
      # prerelease carries breaking changes to the session and callback APIs.
      - dependency-name: next-auth
        update-types: [version-update:semver-patch]

  # Both of these are small and ship independently of the application, so their
  # updates go out as one pull request each rather than split by dependency type.
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      mcp-server:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ops
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      ops:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /mcp-server
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # A base image major is a runtime change to weigh against the engines
      # field in package.json, not something to take from a weekly pull request.
      - dependency-name: node
        update-types: [version-update:semver-major]
